<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#0e1b15">
<meta name="description" content="Guide Magna the monkey through 25 mazes. Find the key, grab the apples and escape the Guardians.">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>The Maze of Magna</title>
<style>
/* Layout: una sola pantalla tipo consola de bolsillo. HUD arriba, laberinto al centro, cruceta abajo.
   Mundo visual: templo de piedra en la selva, de noche. Cada mundo (5 niveles) cambia los colores del laberinto.
   Diseño de un solo tema (oscuro) a propósito. */
:root{
  --night:#0e1b15;     /* fondo general */
  --jungle:#173226;    /* piso del laberinto */
  --moss:#2b5a40;      /* acentos verdes */
  --stone:#dcc794;     /* paredes / botones */
  --stone-d:#8e7a4e;   /* sombra de piedra */
  --banana:#f5c531;    /* acento principal (salida, títulos) */
  --apple:#e4473b;     /* manzanas, vidas */
  --guard:#8f6bd6;     /* enemigo */
  --ink:#f4eedb;       /* texto */
  --muted:#a6b7a4;     /* texto secundario */
  --f-display:'Luckiest Guy','Arial Black',Impact,system-ui,sans-serif;
  --f-body:'Baloo 2','Trebuchet MS',system-ui,sans-serif;
  --pad:76px;
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%;margin:0}
body{
  background:
    radial-gradient(120% 60% at 50% 0%, #1b3a2b 0%, transparent 60%),
    radial-gradient(90% 50% at 50% 110%, #12291f 0%, transparent 70%),
    var(--night);
  color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.4;
  overflow:hidden;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;
  -webkit-tap-highlight-color:transparent;overscroll-behavior:none;
}
#app{height:100%;position:relative;max-width:560px;margin:0 auto}
.screen{position:absolute;inset:0;display:flex;flex-direction:column;gap:16px;padding:16px;overflow-y:auto}
h1,h2,h3{font-family:var(--f-display);font-weight:400;letter-spacing:.02em;margin:0;text-wrap:balance}
h2{font-size:30px;color:var(--banana);text-shadow:0 3px 0 #6b5420}
.muted{color:var(--muted)}
button{font:inherit;color:inherit;cursor:pointer;touch-action:manipulation}
button:focus-visible,input:focus-visible{outline:3px solid var(--banana);outline-offset:2px}

/* ---------- Botones de piedra ---------- */
.btn{
  display:flex;align-items:center;justify-content:center;gap:10px;width:100%;
  font-family:var(--f-display);font-size:22px;letter-spacing:.04em;line-height:1;
  padding:16px 18px 14px;border:0;border-radius:14px;
  background:var(--stone);color:#2a2214;
  box-shadow:0 5px 0 var(--stone-d),0 8px 18px rgba(0,0,0,.35);
  transition:transform .08s,box-shadow .08s;
}
.btn:active{transform:translateY(4px);box-shadow:0 1px 0 var(--stone-d),0 3px 8px rgba(0,0,0,.35)}
.btn.primary{background:var(--banana);box-shadow:0 5px 0 #a87f12,0 8px 18px rgba(0,0,0,.35)}
.btn.primary:active{box-shadow:0 1px 0 #a87f12}
.btn.ghost{background:transparent;color:var(--ink);box-shadow:inset 0 0 0 2px #3d5c4a}
.btn.small{font-size:17px;padding:12px 14px 10px}
.btn[disabled]{opacity:.4;pointer-events:none}
.row{display:flex;gap:12px}
.row>*{flex:1;min-width:0}

/* ---------- Menú ---------- */
.menu{justify-content:center;align-items:stretch;padding-block:24px}
.lang{position:absolute;top:14px;right:16px;display:flex;gap:2px;background:#122a1f;border-radius:10px;padding:3px;z-index:2}
.lang button{border:0;background:transparent;border-radius:8px;padding:5px 10px;font-weight:800;font-size:14px;color:var(--muted)}
.lang button[aria-pressed="true"]{background:var(--stone);color:#2a2214}
.mute{position:absolute;top:14px;left:16px;width:40px;height:34px;border:0;border-radius:10px;background:#122a1f;display:grid;place-items:center;z-index:2}
.mute svg{width:20px;height:20px}
.title{text-align:center;display:flex;flex-direction:column;align-items:center;gap:6px}
.title h1{font-size:clamp(38px,11.5vw,58px);line-height:.95;color:var(--banana);
  text-shadow:0 4px 0 #6b5420,0 10px 24px rgba(0,0,0,.5)}
.title .sub{font-size:15px;letter-spacing:.06em;color:var(--muted);font-weight:700}
#menu-cv{width:180px;height:120px;align-self:center}
.menu-btns{display:flex;flex-direction:column;gap:14px}
.menu-foot{display:flex;justify-content:space-between;font-size:14px;color:var(--muted);font-variant-numeric:tabular-nums}
.bank{display:inline-flex;align-items:center;gap:6px;color:var(--ink)}
.apple-ico{width:16px;height:16px;flex:none}

/* ---------- Pantallas de lista ---------- */
.sheet-head{display:flex;align-items:center;gap:12px}
.back{width:44px;height:44px;flex:none;border:0;border-radius:12px;background:#203d2f;font-size:22px;display:grid;place-items:center}
.list{display:flex;flex-direction:column;gap:8px}
.score-row{display:grid;grid-template-columns:36px 1fr auto;gap:10px;align-items:center;
  padding:12px 14px;border-radius:12px;background:#183327;font-variant-numeric:tabular-nums}
.score-row .rk{font-family:var(--f-display);font-size:20px;color:var(--muted)}
.score-row:first-child .rk{color:var(--banana)}
.score-row .nm{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.score-row .nm small{display:block;color:var(--muted);font-size:13px}
.score-row .pt{font-family:var(--f-display);font-size:20px}
.empty{padding:28px 16px;text-align:center;color:var(--muted);border:2px dashed #2c4a3b;border-radius:14px}
.stat-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.stat{padding:14px;border-radius:12px;background:#183327;display:flex;flex-direction:column;gap:2px;min-width:0}
.stat b{font-family:var(--f-display);font-weight:400;font-size:26px;color:var(--banana);font-variant-numeric:tabular-nums}
.stat span{font-size:14px;color:var(--muted)}
.times{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;font-variant-numeric:tabular-nums;font-size:14px}
.times div{padding:8px 8px;border-radius:10px;background:#142b21;display:flex;justify-content:space-between;gap:4px}
.times div span{color:var(--muted)}
.opt{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px;border-radius:12px;background:#183327}
.opt label{display:flex;flex-direction:column;min-width:0}
.opt label small{color:var(--muted);font-size:13px}
.tog{width:58px;height:34px;flex:none;border:0;border-radius:20px;background:#35503f;position:relative}
.tog::after{content:"";position:absolute;top:4px;left:4px;width:26px;height:26px;border-radius:50%;background:var(--ink);transition:left .15s}
.tog[aria-pressed="true"]{background:var(--moss)}
.tog[aria-pressed="true"]::after{left:28px;background:var(--banana)}
.seg{display:flex;gap:4px;background:#122a1f;border-radius:10px;padding:4px;flex:none}
.seg button{border:0;background:transparent;border-radius:8px;padding:6px 12px;font-weight:700}
.seg button[aria-pressed="true"]{background:var(--stone);color:#2a2214}
.opt input{width:140px;min-width:0;padding:8px 10px;border-radius:10px;border:0;background:#0f2219;color:var(--ink);font:inherit}
.lvl-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.world-h{grid-column:1/-1;display:flex;align-items:center;gap:10px;margin-top:6px;font-family:var(--f-display);font-size:18px;letter-spacing:.03em}
.world-h::after{content:"";flex:1;height:2px;background:currentColor;opacity:.25}
.lvl-btn{aspect-ratio:1;max-width:100%;border:0;border-radius:14px;background:var(--wb,var(--stone));color:#2a2214;position:relative;
  box-shadow:0 4px 0 var(--wd,var(--stone-d));display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px}
.lvl-btn b{font-family:var(--f-display);font-weight:400;font-size:30px;line-height:1}
.lvl-btn small{font-size:12px;line-height:1.1;padding-inline:4px;text-align:center}
.lvl-btn.locked{background:#203a2d;color:#56705f;box-shadow:none}
.lvl-btn .tag{position:absolute;top:6px;right:8px;font-size:10px;font-weight:800;opacity:.75;letter-spacing:-1px}
.lvl-btn .dk{position:absolute;top:5px;left:8px;font-size:11px;font-weight:800;opacity:.7}

/* ---------- Estadísticas: bitácora vertical ---------- */
.st{display:flex;flex-direction:column;gap:22px;padding-bottom:12px}
.st-hero{display:flex;align-items:center;gap:14px}
.st-hero canvas{width:104px;height:104px;flex:none}
.st-hero .rank{font-family:var(--f-display);font-size:26px;line-height:1;color:#ff8fd1;text-shadow:0 2px 0 #6b2a4f}
.st-hero .who{font-size:14px;color:var(--muted);font-weight:700;letter-spacing:.04em}
.st-hero .nx{font-size:13px;color:var(--muted);margin-top:4px}
.st-head{font-size:13px;font-weight:800;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);margin:0 0 8px;font-family:var(--f-body)}
.st-nums{display:flex;flex-direction:column}
.st-nums div{display:flex;align-items:baseline;gap:12px;padding:5px 0}
.st-nums b{font-family:var(--f-display);font-weight:400;font-size:38px;line-height:1;min-width:2.6ch;text-align:right;font-variant-numeric:tabular-nums;color:var(--c)}
.st-nums span{font-size:17px;font-weight:700}
.st-worlds{display:flex;flex-direction:column;gap:12px}
.st-w .top{display:flex;justify-content:space-between;align-items:baseline;gap:8px;font-weight:800}
.st-w .top span:last-child{font-variant-numeric:tabular-nums;font-weight:700;font-size:14px;color:var(--muted)}
.st-w .bar{height:12px;border-radius:6px;background:#0c1f17;overflow:hidden;margin-top:4px}
.st-w .bar i{display:block;height:100%;border-radius:6px;background:var(--c)}
.st-w .tm{display:flex;gap:6px;margin-top:6px;font-size:13px;font-variant-numeric:tabular-nums;color:var(--muted)}
.st-w .tm span{flex:1;min-width:0;text-align:center;padding:3px 0;border-bottom:2px solid var(--c)}
.st-w .tm span b{display:block;color:var(--ink);font-weight:700}
.st-rows{display:flex;flex-direction:column}
.st-rows div{display:flex;align-items:baseline;gap:8px;padding:8px 0;font-size:16px}
.st-rows div + div{border-top:1px dashed #2c4a3b}
.st-rows div i{flex:1}
.st-rows div b{font-family:var(--f-display);font-weight:400;font-size:20px;color:var(--c);font-variant-numeric:tabular-nums}

/* ---------- Estrellas, tienda, objetos ---------- */
.stars{display:inline-flex;gap:2px;color:rgba(0,0,0,.25);font-size:15px;letter-spacing:1px}
.stars .on{color:#9a6b00}
.big-stars{display:flex;justify-content:center;gap:10px;font-size:44px;line-height:1}
.big-stars span{color:#2f4b3d;transform:scale(.8);transition:transform .25s,color .25s}
.big-stars span.on{color:var(--banana);transform:none;text-shadow:0 3px 0 #8a6a14}
.shop{display:flex;flex-direction:column;gap:12px}
.shop h3{font-size:20px;color:var(--ink);margin-top:4px}
.item-card{display:grid;grid-template-columns:52px 1fr auto;gap:12px;align-items:center;padding:14px;border-radius:14px;background:#183327}
.item-card .ic{width:52px;height:52px;border-radius:14px;background:#0f2219;display:grid;place-items:center}
.item-card .ic svg{width:32px;height:32px}
.item-card h4{margin:0;font-size:17px;font-weight:800;line-height:1.2}
.item-card p{margin:2px 0 0;font-size:14px;color:var(--muted);line-height:1.3}
.item-card .own{font-size:13px;color:var(--ink);font-weight:700}
.style-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:10px}
.style-card{border:0;border-radius:14px;background:#183327;padding:10px 8px;display:flex;flex-direction:column;align-items:center;gap:4px;box-shadow:inset 0 0 0 2px transparent}
.style-card.on{box-shadow:inset 0 0 0 3px var(--banana)}
.style-card canvas{width:64px;height:64px}
.style-card b{font-size:14px}
.style-card span{font-size:13px;color:var(--muted);display:inline-flex;align-items:center;gap:4px}
.pips{display:inline-flex;gap:4px;margin-top:4px}
.pips i{width:10px;height:10px;border-radius:50%;background:#2c4a3b}
.pips i.on{background:var(--banana)}
.buy{border:0;border-radius:12px;padding:10px 12px;background:var(--banana);color:#2a2214;font-weight:800;display:flex;gap:5px;align-items:center;box-shadow:0 4px 0 #a87f12;white-space:nowrap}
.buy[disabled]{background:#35503f;color:#7d927f;box-shadow:none}
.shop-bank{display:flex;align-items:center;gap:8px;padding:12px 14px;border-radius:12px;background:#0f2219;font-weight:700;font-variant-numeric:tabular-nums;position:sticky;top:0;z-index:2}
.shop-next{position:sticky;bottom:0}

/* ---------- Pantalla de juego ---------- */
.game{padding:8px 12px 12px;gap:8px}
.hud{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:4px 8px;font-variant-numeric:tabular-nums;flex:none}
.hud-grp{display:flex;align-items:center;gap:8px;min-width:0}
.hud-grp:last-child{margin-left:auto}
.chip{display:inline-flex;align-items:center;gap:5px;padding:5px 10px;border-radius:10px;background:#183327;font-weight:700;font-size:15px;white-space:nowrap}
.chip.lv{font-family:var(--f-display);font-weight:400;font-size:17px;color:var(--banana);letter-spacing:.03em}
.chip.lives{color:var(--apple)}
.chip.lives b{color:var(--ink)}
.chip .amulet b{color:#9fe3c9}
.chip.key{color:#f5c531}
.icon-btn{width:40px;height:40px;flex:none;border:0;border-radius:11px;background:#203d2f;display:grid;place-items:center}
.stage{position:relative;flex:1;min-height:0;border-radius:16px;overflow:hidden;background:#0b1712;touch-action:none;
  box-shadow:inset 0 0 0 2px #24402f}
#cv{position:absolute;inset:0;width:100%;height:100%;display:block}
.toast{position:absolute;left:50%;top:12px;transform:translateX(-50%);padding:8px 14px;border-radius:12px;max-width:calc(100% - 24px);
  background:rgba(14,27,21,.9);font-weight:700;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;pointer-events:none;
  box-shadow:0 0 0 2px #2f5541;z-index:3}
.toast.warn{color:#d7c6ff;box-shadow:0 0 0 2px #3a2d5c}
.pad{flex:none;display:grid;grid-template-columns:repeat(3,var(--pad));grid-template-rows:repeat(3,calc(var(--pad)*.82));
  justify-content:center;gap:6px;padding-top:4px;touch-action:none}
.pad button{border:0;border-radius:18px;background:var(--stone);color:#2a2214;box-shadow:0 5px 0 var(--stone-d);
  display:grid;place-items:center;touch-action:none;position:relative}
.pad button svg{width:44%;height:44%}
.pad button.on{background:var(--banana);box-shadow:0 5px 0 #a87f12}
.pad button.hint::after{content:"";position:absolute;inset:-4px;border-radius:21px;border:3px solid var(--banana);animation:hint .9s ease-in-out infinite}
@keyframes hint{0%,100%{opacity:.25}50%{opacity:1}}
.pad button.press{transform:translateY(4px);box-shadow:0 1px 0 var(--stone-d)}
.pad .up{grid-column:2;grid-row:1}.pad .left{grid-column:1;grid-row:2}.pad .right{grid-column:3;grid-row:2}.pad .down{grid-column:2;grid-row:3}
.pad .hub{grid-column:2;grid-row:2;border-radius:50%;background:#183327;display:grid;place-items:center;margin:10px}
.pad .hub canvas{width:100%;height:100%}
.pad .item{border-radius:50%;margin:8px;background:#203d2f;color:var(--ink);box-shadow:0 3px 0 #0c1a13}
.pad .item svg{width:56%;height:56%}
.pad .item.f{grid-column:1;grid-row:1}.pad .item.b{grid-column:3;grid-row:1}.pad .item.h{grid-column:1;grid-row:3}.pad .item.g{grid-column:3;grid-row:3}
.pad .item .n{position:absolute;right:-4px;top:-4px;min-width:20px;height:20px;border-radius:10px;background:var(--banana);color:#2a2214;font-size:12px;font-weight:800;display:grid;place-items:center;padding:0 4px}
.pad .item.empty{opacity:.35}
.pad .item.active{background:var(--moss);box-shadow:0 0 0 3px var(--banana)}

/* Mejoras pasivas activas: iconitos a los costados de la cruceta */
.pad-wrap{position:relative;flex:none}
.passives{position:absolute;top:6px;bottom:2px;width:calc((100% - var(--pad)*3 - 12px)/2 - 6px);display:flex;flex-direction:column;flex-wrap:wrap;gap:5px;align-content:flex-start}
.passives.l{left:0}.passives.r{right:0;flex-wrap:wrap-reverse}
.passives button{width:28px;height:28px;flex:none;border:0;border-radius:50%;background:#183327;box-shadow:inset 0 0 0 1px #2f5541;display:grid;place-items:center;position:relative;padding:0}
.passives button svg{width:17px;height:17px}
.passives button i{position:absolute;right:-3px;bottom:-3px;min-width:14px;height:14px;border-radius:7px;background:var(--banana);color:#2a2214;font-size:10px;font-weight:800;font-style:normal;line-height:14px;text-align:center}

/* ---------- Overlays ---------- */
.overlay{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding:16px;
  background:rgba(8,16,12,.72);backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);z-index:5}
.overlay.on-stage{padding:10px;border-radius:16px}
.card{width:100%;max-width:400px;max-height:100%;overflow-y:auto;background:#163024;border-radius:20px;padding:22px 20px;
  display:flex;flex-direction:column;gap:14px;box-shadow:0 0 0 2px #2f5541,0 20px 50px rgba(0,0,0,.55);
  animation:pop .22s ease-out}
.overlay.on-stage .card{padding:16px;gap:10px}
@keyframes pop{from{transform:scale(.92);opacity:0}to{transform:none;opacity:1}}
.card .eyebrow{font-size:13px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-weight:700}
.card .world{font-size:13px;font-weight:800;letter-spacing:.06em;color:var(--wc,var(--banana))}
.card h2{font-size:32px}
.card p{margin:0}
.facts{display:flex;flex-wrap:wrap;gap:8px}
.facts span{padding:5px 10px;border-radius:10px;background:#0f2219;font-weight:700;font-size:14px;display:inline-flex;gap:6px;align-items:center}
.facts span.guard{color:#d7c6ff;box-shadow:inset 0 0 0 1px #5a4596}
.facts span.dark{color:#c9c2ea;background:#1b1830}
.facts span.gold{color:var(--banana)}
.facts span.mech{color:#9fe3c9;box-shadow:inset 0 0 0 1px #2c6a55}
.breakdown{display:flex;flex-direction:column;gap:6px;font-variant-numeric:tabular-nums}
.breakdown div{display:flex;justify-content:space-between;gap:10px;padding:6px 0;border-bottom:1px solid #24443a}
.breakdown div.total{border:0;font-family:var(--f-display);font-size:24px;color:var(--banana);padding-top:8px}
.breakdown div span:first-child{color:var(--muted)}
.name-row{display:flex;gap:8px}
.name-row input{flex:1;min-width:0;padding:12px;border-radius:12px;border:0;background:#0f2219;color:var(--ink);font:inherit;font-size:17px}
.saved{color:var(--banana);font-weight:700}
@media (prefers-reduced-motion:reduce){.card{animation:none}.btn,.tog::after{transition:none}.pad button.hint::after{animation:none;opacity:1}}
@media (max-height:640px){:root{--pad:62px}.game{gap:6px}}
@media (max-width:400px){.hud,.hud-grp{gap:5px}.chip{padding:4px 7px;font-size:14px}.chip.lv{font-size:15px}.icon-btn{width:36px;height:36px}.times{grid-template-columns:repeat(3,1fr)}}

<body>

<div id="app">

  <!-- ===================== MENÚ ===================== -->
  <section id="scr-menu" class="screen menu">
    <button class="mute" id="btn-music" data-ta="o_music"></button>
    <div class="lang" role="group" aria-label="Language / Idioma">
      <button data-lang="en">EN</button><button data-lang="es">ES</button>
    </div>
    <div class="title">
      <canvas id="menu-cv" width="360" height="240"></canvas>
      <h1 data-t="title_html">The Maze<br>of Magna</h1>
      <div class="sub" data-t="subtitle">Guide Magna the monkey to the exit.</div>
    </div>
    <div class="menu-btns">
      <button class="btn primary" data-go="play" data-t="play">Play</button>
      <div class="row">
        <button class="btn small" data-go="levels" data-t="levels">Levels</button>
        <button class="btn small" data-go="shop" data-t="shop">Shop</button>
      </div>
      <div class="row">
        <button class="btn small" data-go="scores" data-t="scores">Scores</button>
        <button class="btn small" data-go="stats" data-t="stats">Stats</button>
      </div>
      <button class="btn ghost small" data-go="options" data-t="options">Options</button>
    </div>
    <div class="menu-foot">
      <span class="bank"><svg class="apple-ico" viewBox="0 0 16 16"><circle cx="8" cy="9.5" r="5.5" fill="#e4473b"/><path d="M8 4.5 Q8.5 2 10 1.5" stroke="#7a4b22" stroke-width="1.4" fill="none"/><ellipse cx="11" cy="3.5" rx="2.2" ry="1.1" fill="#5fae4f"/></svg><span id="menu-bank">0</span></span>
      <span id="menu-ver">v1.0</span>
    </div>
  </section>

  <!-- ===================== NIVELES ===================== -->
  <section id="scr-levels" class="screen" hidden>
    <div class="sheet-head"><button class="back" data-go="menu" data-ta="back">&#8592;</button><h2 data-t="levels">Levels</h2></div>
    <p class="muted" style="margin:0" data-t="levels_note"></p>
    <div class="lvl-grid" id="lvl-grid"></div>
  </section>

  <!-- ===================== TIENDA ===================== -->
  <section id="scr-shop" class="screen" hidden>
    <div class="sheet-head"><button class="back" data-go="shop-back" data-ta="back">&#8592;</button><h2 data-t="shop_title">Apple Shop</h2></div>
    <div class="shop-bank"><svg class="apple-ico" viewBox="0 0 16 16"><circle cx="8" cy="9.5" r="5.5" fill="#e4473b"/><path d="M8 4.5 Q8.5 2 10 1.5" stroke="#7a4b22" stroke-width="1.4" fill="none"/><ellipse cx="11" cy="3.5" rx="2.2" ry="1.1" fill="#5fae4f"/></svg><span id="shop-bank"></span></div>
    <div class="shop" id="shop-list"></div>
    <p class="muted" style="margin:0;font-size:14px" data-t="shop_note"></p>
    <button class="btn primary shop-next" id="shop-next" data-go="shop-next" hidden></button>
  </section>

  <!-- ===================== PUNTAJES ===================== -->
  <section id="scr-scores" class="screen" hidden>
    <div class="sheet-head"><button class="back" data-go="menu" data-ta="back">&#8592;</button><h2 data-t="scores_title">High Scores</h2></div>
    <div class="list" id="score-list"></div>
  </section>

  <!-- ===================== ESTADÍSTICAS ===================== -->
  <section id="scr-stats" class="screen" hidden>
    <div class="sheet-head"><button class="back" data-go="menu" data-ta="back">&#8592;</button><h2 data-t="stats">Stats</h2></div>
    <div id="stats-body" class="st"></div>
  </section>

  <!-- ===================== OPCIONES ===================== -->
  <section id="scr-options" class="screen" hidden>
    <div class="sheet-head"><button class="back" data-go="menu" data-ta="back">&#8592;</button><h2 data-t="options">Options</h2></div>
    <div class="list" id="opt-list"></div>
  </section>

  <!-- ===================== JUEGO ===================== -->
  <section id="scr-game" class="screen game" hidden>
    <header class="hud">
      <div class="hud-grp">
        <span class="chip lv" id="hud-lv"></span>
        <span class="chip lives" id="hud-lives"></span>
        <span class="chip key" id="hud-key" hidden></span>
      </div>
      <div class="hud-grp">
        <span class="chip" id="hud-time">0:00</span>
        <span class="chip"><svg class="apple-ico" viewBox="0 0 16 16"><circle cx="8" cy="9.5" r="5.5" fill="#e4473b"/><path d="M8 4.5 Q8.5 2 10 1.5" stroke="#7a4b22" stroke-width="1.4" fill="none"/><ellipse cx="11" cy="3.5" rx="2.2" ry="1.1" fill="#5fae4f"/></svg><span id="hud-apples">0/0</span></span>
        <span class="chip" id="hud-score">0</span>
        <button class="icon-btn" id="btn-pause" data-ta="pause"><svg viewBox="0 0 20 20" width="18" height="18"><rect x="4" y="3" width="4" height="14" rx="1.5" fill="currentColor"/><rect x="12" y="3" width="4" height="14" rx="1.5" fill="currentColor"/></svg></button>
      </div>
    </header>
    <div class="stage" id="stage">
      <canvas id="cv"></canvas>
      <div class="toast" id="toast" hidden></div>
    </div>
    <div class="pad-wrap">
    <div class="passives l" id="pas-l"></div><div class="passives r" id="pas-r"></div>
    <div class="pad" id="pad">
      <button class="item f" data-item="fireflies" data-ta="use_fireflies"></button>
      <button class="item b" data-item="banana" data-ta="use_banana"></button>
      <button class="item h" data-item="hammer" data-ta="use_hammer" hidden></button>
      <button class="item g" data-item="hourglass" data-ta="use_hourglass"></button>
      <button class="up" data-dir="up" data-ta="up"><svg viewBox="0 0 24 24"><path d="M4 16 12 7l8 9" stroke="currentColor" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
      <button class="left" data-dir="left" data-ta="left"><svg viewBox="0 0 24 24"><path d="M16 4 7 12l9 8" stroke="currentColor" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
      <div class="hub"><canvas id="hub-cv" width="120" height="120"></canvas></div>
      <button class="right" data-dir="right" data-ta="right"><svg viewBox="0 0 24 24"><path d="M8 4l9 8-9 8" stroke="currentColor" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
      <button class="down" data-dir="down" data-ta="down"><svg viewBox="0 0 24 24"><path d="M4 8l8 9 8-9" stroke="currentColor" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
    </div>
    </div>
    <div class="overlay" id="ov" hidden><div class="card" id="ov-card"></div></div>
  </section>
</div>

<script>
'use strict';
/* =====================================================================
   THE MAZE OF MAGNA — código fuente único (leer MAGNA_NOTES.md primero).
   Mapa de secciones (buscar "== N."):
     0. I18N          textos en inglés y español (t('clave'))
     1. CONFIG        constantes de juego, puntaje, tienda, estilos
     2. WORLDS+LEVELS 4 mundos (colores + música) y 20 niveles
     3. MAZE          RNG, generación, BFS, salida, manzanas, llave/reja, portales, pistas veloces
     4. SAVE          persistencia (localStorage con try/catch)
     5. AUDIO+MUSIC   efectos sintetizados y música funky por mundo
     6. MOVER         movimiento continuo; el jugador frena en cada cruce
     7. ENEMY AI      deambular / ver / rugir / perseguir / cansarse
     8. GAME FLOW     partida, niveles, vidas, puntaje, objetos, martillo, llave, portales
     9. RENDER        canvas: laberinto por mundo, rastro, oscuridad, macaco, guardián
    10. INPUT         cruceta, swipe, teclado
    11. UI            pantallas, overlays, tienda (también entre niveles)
    12. BOOT + DEBUG  arranque y API de pruebas (window.MAGNA)
   ===================================================================== */

/* == 6. MOVER ==========================================================
   Un "mover" vive en la celda c. Si moving, va de c a n con progreso t (0..1).
   JUGADOR (auto=true): want = última flecha tocada; pending = esa orden aún no se cumplió.
     En cada centro de celda: si hay orden pendiente y ese camino está libre → la cumple.
     Si no: en un pasillo (una sola opción sin volver atrás) sigue solo, doblando las esquinas;
     en un CRUCE (2+ opciones) o callejón → FRENA y espera (waiting).
     Tocar la dirección contraria en medio de un tramo da la vuelta al instante.
   GUARDIÁN (auto=false): usa want si puede; si no, sigue en dir; si no, se queda. */
function makeMover(cell, dir, speed, auto = false) {
  return { c: cell, n: cell, t: 0, dir, want: dir, speed, moving: false, waiting: false, face: 1, phase: 0, auto, pending: auto, moved: false };
}
function moverXY(m, e) {
  const ax = e.c % m.w, ay = (e.c / m.w) | 0;
  if (!e.moving) return [ax, ay];
  const bx = e.n % m.w, by = (e.n / m.w) | 0;
  return [ax + (bx - ax) * e.t, ay + (by - ay) * e.t];
}
function nearCell(e) { return e.moving && e.t > 0.5 ? e.n : e.c; }
function chooseDir(m, e) {
  if (!e.auto) return canGo(m, e.c, e.want) ? e.want : canGo(m, e.c, e.dir) ? e.dir : null;
  if (e.pending && canGo(m, e.c, e.want)) { e.pending = false; return e.want; }
  const back = e.moved ? DIRS[e.dir].opp : null;
  const opts = DIR_KEYS.filter(k => k !== back && canGo(m, e.c, k));
  return opts.length === 1 ? opts[0] : null;
}
function updateMover(m, e, dt, hooks = {}) {
  if (e.moving && e.want === DIRS[e.dir].opp && (!e.auto || e.pending)) {
    const c = e.c; e.c = e.n; e.n = c; e.t = 1 - e.t; e.dir = e.want; if (e.auto) e.pending = false;
  }
  let rem = e.speed * dt, guard = 0;
  while (rem > 1e-9 && guard++ < 8) {
    if (!e.moving) {
      if (hooks.decide) hooks.decide(e);
      const d = chooseDir(m, e);
      if (!d) { if (!e.waiting && hooks.wait) hooks.wait(); e.waiting = true; break; }
      e.waiting = false; e.dir = d; e.n = step(m, e.c, d); e.t = 0; e.moving = true; e.moved = true;
      if (DIRS[d].dx) e.face = DIRS[d].dx;
    }
    const need = 1 - e.t;
    if (rem < need) { e.t += rem; rem = 0; }
    else { rem -= need; e.c = e.n; e.t = 0; e.moving = false; if (hooks.arrive && hooks.arrive(e.c) === false) return; }
  }
  e.phase += dt;
}

/* == 7. ENEMY AI ======================================================= */
function makeEnemy(cfg, m, R, cell = m.start) {
  const e = makeMover(cell, 'right', CFG.playerSpeed * CFG.wanderFactor);
  return Object.assign(e, { cfg, state: 'wander', last: -1, freeze: CFG.spawnFreeze, alertT: 0, R, pause: 0, tired: 0, chaseT: 0,
    visited: new Float32Array(m.w * m.h).fill(-1e9), alpha: 0 });
}
function guardSpeed(f) { return CFG.playerSpeed * f * (1 - CFG.upgrades.slow.per * upgLvl('slow')); }
// Avanza un guardián (lo usan el juego y las simulaciones). Devuelve true si atrapó al jugador.
function stepEnemy(m, e, player, dt, time) {
  e.alertT = Math.max(0, e.alertT - dt);
  if (e.tired > 0) { e.tired -= dt; }
  else if (e.state === 'chase' && !e.cfg.elite) { e.chaseT += dt; if (e.chaseT > CFG.tireAfter) { e.tired = CFG.tiredFor; e.chaseT = 0; e.state = 'wander'; } }
  else e.chaseT = Math.max(0, e.chaseT - dt);
  if (e.freeze > 0) { e.freeze -= dt; return false; }
  if (e.slowT > 0) e.slowT -= dt;
  if (e.pause > 0) { e.pause -= dt; }
  else updateMover(m, e, dt * (e.slowT > 0 ? CFG.slow.mult : 1), { decide: en => enemyDecide(m, en, player, time),
    arrive: c => { if (m.slows && m.slows.includes(c)) e.slowT = CFG.slow.secs; // el piso pegajoso también frena a los guardianes
      if (openCount(m.walls[c]) >= 3) { e.pause = CFG.guardPause[e.state === 'chase' ? 'chase' : 'wander']; return false; } } });
  const [ex, ey] = moverXY(m, e), [px, py] = moverXY(m, player);
  return Math.hypot(ex - px, ey - py) < CFG.catchDist;
}
// Manada: el guardián que te ve aúlla; los guardianes cercanos (que no estén cansados ni persiguiendo) corren a ese lugar
function packCall(m, src, others, cell) {
  const { dist } = bfs(m, src.c); let n = 0;
  for (const o of others) { if (!o || o === src || o.tired > 0 || o.state === 'chase' || o.freeze > 0) continue;
    const d = dist[nearCell(o)]; if (d < 0 || d > CFG.packRange) continue;
    o.state = 'search'; o.last = cell; o.alertT = 0.8; n++; }
  src.howlT = 1; return n;
}
function sightDir(m, from, targets, range) {
  for (const k of DIR_KEYS) {
    let c = from;
    for (let s = 0; s < range; s++) {
      if (!canGo(m, c, k)) break;
      c = step(m, c, k);
      if (targets.includes(c)) return k;
    }
  }
  return null;
}
function dirToward(m, from, to) {
  if (from === to) return null;
  const { dist } = bfs(m, to);
  let best = null, bd = Infinity;
  for (const k of DIR_KEYS) { if (!canGo(m, from, k)) continue; const d = dist[step(m, from, k)];
    if (d >= 0 && d < bd) { bd = d; best = k; } }
  return best;
}
function enemyDecide(m, e, player, time) {
  e.visited[e.c] = time;
  if (e.tired > 0) { // cansado: no persigue, deambula lento
    e.speed = guardSpeed(CFG.wanderFactor * CFG.tiredFactor);
    const o = DIR_KEYS.filter(k => canGo(m, e.c, k)); let ch = o.filter(k => k !== DIRS[e.dir].opp); if (!ch.length) ch = o;
    e.want = ch[(e.R() * ch.length) | 0]; return;
  }
  const pc = [player.c]; if (player.moving) pc.push(player.n);
  const seen = pc.includes(e.c) ? dirToward(m, e.c, player.n) : sightDir(m, e.c, pc, e.cfg.vision);
  if (seen) {
    if (e.state !== 'chase') { e.state = 'chase'; e.alertT = 1.2; e.pause = CFG.roar; GAME.onSpotted(); if (e.onSpot) e.onSpot(e, nearCell(player)); }
    e.last = nearCell(player); e.want = seen; e.speed = guardSpeed(e.cfg.speed); return;
  }
  if (e.state === 'chase') e.state = 'search';
  if (e.state === 'search') {
    const d = e.c !== e.last ? dirToward(m, e.c, e.last) : null;
    if (d) { e.want = d; e.speed = guardSpeed(CFG.searchFactor); return; }
    e.state = 'wander';
  }
  e.speed = guardSpeed(CFG.wanderFactor);
  const opts = DIR_KEYS.filter(k => canGo(m, e.c, k));
  let ch = opts.filter(k => k !== DIRS[e.dir].opp); if (!ch.length) ch = opts;
  if (e.R() < e.cfg.sense) { const d = dirToward(m, e.c, nearCell(player)); if (d) { e.want = d; return; } }
  if (e.R() < 0.75) ch.sort((a, b) => (e.visited[step(m, e.c, a)] - e.visited[step(m, e.c, b)]) + (e.R() - 0.5) * 0.5);
  else ch.sort(() => e.R() - 0.5);
  e.want = ch[0];
}

const GAME = {

  light() { const d = LEVELS[this.li].dark; return d ? d + CFG.upgrades.lantern.per * upgLvl('lantern') : 0; },
  target() { const m = this.m; return m.gate && m.gate.closed && m.key >= 0 ? m.key : m.exit; }, // a dónde ir ahora

  startRun(mode, li = 0) {
    this.mode = mode; this.score = 0; this.lives = CFG.lives + upgLvl('heart'); this.hammers = upgLvl('hammer');
    if (mode === 'run') { SAVE.stats.runs++; persist(); }
    UI.show('game'); this.load(li);
  },
  load(li) {
    const newWorld = this.m && worldOf(li) !== worldOf(this.li);
    this.li = li; this.m = buildLevel(li); MUSIC.setWorld(worldOf(li));
    if (this.mode === 'practice') this.hammers = upgLvl('hammer');
    this.reset(); UI.introCard(newWorld || li % 5 === 0);
  },
  reset() {
    const m = this.m; m.walls = m.walls0 ? m.walls0.slice() : m.walls; m.walls0 = m.walls.slice();
    if (m.gate) m.gate.closed = true;
    this.player = makeMover(m.start, 'right', this.baseSpeed(), true);
    this.apples = m.apples.map(c => ({ c, taken: false })); this.goldGot = false; this.hasKey = false; this.lastPortal = -1;
    this.got = 0; this.time = 0; this.particles = []; this.shake = 0; this.fx = { fireflies: 0, banana: 0, pad: 0, hourglass: 0, slow: 0 }; updateDoors(m, 0);
    this.seen = new Uint8Array(m.w * m.h); this.trail = new Uint8Array(m.w * m.h); this.trail[m.start] = 1;
    this.refreshTarget();
    const R = rng(31337 + this.li * 97 + Math.floor(Math.random() * 1e6));
    const extra = CFG.upgrades.delay.per * upgLvl('delay');
    this.enemies = LEVELS[this.li].enemies.map(cfg => ({ cfg, delay: cfg.delay + extra, warned: false, mv: null, R }));
    this.aim = false; this.state = 'intro'; this.markSeen(); R_.layout(); UI.passives(); UI.hud(); UI.toast(null);
  },
  refreshTarget() { DOORS_OFF = true; this.toTarget = bfs(this.m, this.target()).dist; DOORS_OFF = false; },
  begin() { if (this.state !== 'intro') return; AU.init(); this.state = 'playing'; UI.closeOverlay(); },
  pause() { if (this.state !== 'playing') return; this.state = 'paused'; UI.pauseCard(); },
  resume() { if (this.state !== 'paused') return; this.state = 'playing'; UI.closeOverlay(); },
  markSeen() {
    const r = this.light(); if (!r) return;
    const m = this.m, [px, py] = moverXY(m, this.player), r2 = r * r;
    for (let y = Math.max(0, Math.floor(py - r)); y <= Math.min(m.h - 1, Math.ceil(py + r)); y++)
      for (let x = Math.max(0, Math.floor(px - r)); x <= Math.min(m.w - 1, Math.ceil(px + r)); x++)
        if ((x - px) ** 2 + (y - py) ** 2 <= r2) this.seen[y * m.w + x] = 1;
  },

  update(dt) {
    const m = this.m, p = this.player;
    this.time += dt;
    for (const k in this.fx) this.fx[k] = Math.max(0, this.fx[k] - dt);

  },
  cx(x) { return this.pad + (x + 0.5) * this.cell; },

const INPUT = {
  init() {

      b.addEventListener('pointerdown', ev => { ev.preventDefault(); b.classList.add('press'); GAME.setDir(b.dataset.dir); });
      ['pointerup', 'pointercancel', 'pointerleave'].forEach(tp => b.addEventListener(tp, () => b.classList.remove('press')));
      b.addEventListener('contextmenu', ev => ev.preventDefault());
    });
    document.querySelectorAll('#pad [data-item]').forEach(b => {
      b.addEventListener('pointerdown', ev => { ev.preventDefault(); GAME.useItem(b.dataset.item); });
      b.addEventListener('contextmenu', ev => ev.preventDefault());
    });
    const st = document.getElementById('stage'); let o = null;
    st.addEventListener('pointerdown', ev => { o = { x: ev.clientX, y: ev.clientY }; if (GAME.state === 'intro') AU.init(); });
    st.addEventListener('pointermove', ev => {
      if (!o || !SAVE.opts.swipe) return;
      const dx = ev.clientX - o.x, dy = ev.clientY - o.y;
      if (Math.hypot(dx, dy) < 22) return;
      GAME.setDir(Math.abs(dx) > Math.abs(dy) ? (dx > 0 ? 'right' : 'left') : (dy > 0 ? 'down' : 'up'));
      o = { x: ev.clientX, y: ev.clientY };
    });
    ['pointerup', 'pointercancel'].forEach(tp => st.addEventListener(tp, () => o = null));
    const keys = { ArrowUp: 'up', ArrowDown: 'down', ArrowLeft: 'left', ArrowRight: 'right', w: 'up', s: 'down', a: 'left', d: 'right', W: 'up', S: 'down', A: 'left', D: 'right' };
    window.addEventListener('keydown', ev => {
      if (UI.cur !== 'game' || ev.target.tagName === 'INPUT') return;
      if (keys[ev.key]) { ev.preventDefault(); GAME.setDir(keys[ev.key]); }
      else if (ev.key === '1') GAME.useItem('fireflies');
      else if (ev.key === '2') GAME.useItem('banana');
      else if (ev.key === '3' || ev.key === 'h' || ev.key === 'H') GAME.useItem('hammer');
      else if (ev.key === '4') GAME.useItem('hourglass');
      else if (ev.key === 'Escape' || ev.key === 'p' || ev.key === 'P') { GAME.state === 'paused' ? GAME.resume() : GAME.pause(); }
      else if (ev.key === 'Enter' || ev.key === ' ') { const b = document.querySelector('#ov-card .btn.primary'); if (b && !document.getElementById('ov').hidden) { ev.preventDefault(); b.click(); } }
    });
    document.addEventListener('visibilitychange', () => { if (document.hidden) GAME.pause(); });
    document.addEventListener('pointerdown', () => AU.init(), { once: false, passive: true });
  }
};

/* Mini animaciones: macaco del menú y del centro de la cruceta */
function drawMini(cv, now, menu) {
  const g = cv.getContext('2d'), W = cv.width, H = cv.height; g.clearRect(0, 0, W, H);
  const c = Math.min(W, H) * (menu ? 0.5 : 0.95);
  const mv = { face: 1, dir: 'right', moving: true, phase: now, waiting: false };
  if (menu) {
    g.fillStyle = 'rgba(220,199,148,.9)'; g.fillRect(W * 0.05, H * 0.86, W * 0.9, H * 0.05);
    const x = W * 0.5 + Math.sin(now * 1.3) * W * 0.22;
    mv.face = Math.cos(now * 1.3) >= 0 ? 1 : -1; mv.dir = mv.face > 0 ? 'right' : 'left';
    drawMonkey(g, x, H * 0.6, c, mv, now, SAVE.cos);
    drawApple(g, W * 0.12, H * 0.68, c * 0.8); drawApple(g, W * 0.88, H * 0.68, c * 0.8, true, now);
  } else {
    const p = GAME.player; if (p) { mv.dir = p.dir; mv.face = p.face; mv.moving = GAME.state === 'playing' && p.moving; mv.waiting = p.waiting; mv.phase = p.phase; }
    drawMonkey(g, W / 2, H * 0.5, c, mv, now);
  }
}

/* == 12. BOOT + DEBUG ================================================== */
let lastT = performance.now();
function frame(now) {
  requestAnimationFrame(frame);
  const dt = Math.min(0.05, (now - lastT) / 1000); lastT = now; const ts = now / 1000;
  MUSIC.update();
  if (UI.cur === 'menu') drawMini($('menu-cv'), ts, true);
  if (UI.cur !== 'game' || !GAME.m) return;
  if (GAME.state === 'playing') { GAME.update(dt); UI.hud(); }
  R_.tickParticles(dt); UI.tick(dt); R_.draw(ts, dt);
  drawMini($('hub-cv'), ts, false);
}
function boot() {
  loadSave(); R_.init(); INPUT.init(); UI.init(); UI.show('menu'); requestAnimationFrame(frame);
  if (GIFTED) setTimeout(() => { const el = document.createElement('div'); el.className = 'toast'; el.style.position = 'fixed'; el.style.top = '60px';
    el.textContent = t('t_gift'); document.body.appendChild(el); setTimeout(() => el.remove(), 3500); }, 300);
}
boot();

  CFG, LEVELS, WORLDS, buildLevel, GAME, SAVE, MUSIC, buyItem, buyUpgrade, buyStyle, refundUpgrades, bfs,
  check() {
    return LEVELS.map((L, i) => { const m = buildLevel(i);
      const open = { ...m, gate: m.gate ? { ...m.gate, closed: false } : null };
      const dOpen = bfs(open, 0).dist, dLocked = bfs(m, 0, m.exit).dist;
      const reach = Array.from(dOpen).every(d => d >= 0);
      const exitLeaf = DIR_KEYS.filter(k => !(m.walls[m.exit] & DIRS[k].bit)).length === 1;
      const items = m.apples.concat(m.golden >= 0 ? [m.golden] : []).concat(m.key >= 0 ? [m.key] : []).concat(m.portals);
      const deadEnds = Array.from(m.walls).filter(w => openCount(w) === 1).length;
      return { lvl: i + 1, world: worldOf(i) + 1, size: L.w + 'x' + L.h, path: m.pathLen, deadEnds, apples: m.apples.length, golden: m.golden >= 0,
        key: m.key >= 0, keyReachableLocked: m.key < 0 || dLocked[m.key] > 0, exitLockedUntilKey: !m.gate || bfs(m, 0).dist[m.exit] < 0,
        portals: m.portals.length, pads: m.pads.length, doors: m.doors.length, slows: m.slows.length, itemsOk: items.every(a => dLocked[a] > 0 && a !== m.exit), exitLeaf, reach,
        guards: L.enemies.length, dark: L.dark || 0, par: m.par }; });
  },
  // Bot "humano": va a la llave (si hay), a la manzana más cercana y a la salida; huye si un guardián está a <= fear pasos.
  smart(i, opts = {}) {
    const m = buildLevel(i), p = makeMover(m.start, 'right', CFG.playerSpeed, true), dt = 1 / 60;
    if (m.gate) m.gate.closed = true;
    const left = new Set(opts.apples === false ? [] : m.apples.concat(m.golden >= 0 ? [m.golden] : []));
    const enemies = (opts.enemies === false ? [] : LEVELS[i].enemies).map((cfg, j) => ({ cfg, mv: null, R: rng((opts.seed || 1) * 977 + j) }));
    const fear = opts.fear ?? 5, react = opts.react ?? 0.25; let tt = 0, done = false, caught = false, waitT = 0, flees = 0, hasKey = m.key < 0, lastPortal = -1;
    const saved = GAME.onSpotted; GAME.onSpotted = () => {};
    const decide = e => {
      const back = e.moved ? DIRS[e.dir].opp : null, opts2 = DIR_KEYS.filter(d => d !== back && canGo(m, e.c, d));
      const live = enemies.filter(s => s.mv).map(s => nearCell(s.mv));
      const dl = bfs(m, e.c).dist, near = live.filter(g => dl[g] >= 0 && dl[g] <= fear);
      let k;
      if (near.length) { flees++; const gd = near.map(g => bfs(m, g).dist);
        const score = d => Math.min(...gd.map(x => x[step(m, e.c, d)])) * 10 + bfs(m, step(m, e.c, d), e.c).dist.filter(v => v >= 0).length * 0.01;
        let cand = DIR_KEYS.filter(d => canGo(m, e.c, d) && d !== back); if (!cand.length) cand = DIR_KEYS.filter(d => canGo(m, e.c, d));
        const myD = Math.min(...gd.map(x => x[e.c])); const safe = cand.filter(d => Math.min(...gd.map(x => x[step(m, e.c, d)])) > myD);
        k = (safe.length ? safe : DIR_KEYS.filter(d => canGo(m, e.c, d))).sort((a, b) => score(b) - score(a))[0]; }
      else { DOORS_OFF = true; const dist = bfs(m, e.c, m.exit).dist; let tgt = m.exit;
        if (!hasKey) tgt = m.key; else if (left.size) tgt = [...left].sort((a, b) => dist[a] - dist[b])[0];
        k = dirToward(m, e.c, tgt); DOORS_OFF = false; }
      if (opts2.length > 1 && !near.length) { if (waitT < react) { waitT += dt; e.want = null; e.pending = false; return; } }
      waitT = 0; e.want = k; e.pending = true;
    };
    const arrive = c => {
      left.delete(c); if (c !== lastPortal) lastPortal = -1;
      if (m.slows.includes(c)) slowT = CFG.slow.secs;
      if (c === m.key) { hasKey = true; m.gate.closed = false; }
      if (c === m.exit) { done = true; return false; }
      const pi = m.portals.indexOf(c);
      if (pi >= 0 && lastPortal < 0 && opts.portals !== false) { const to = m.portals[1 - pi]; p.c = p.n = to; p.t = 0; p.moving = false; p.moved = false; p.pending = false; lastPortal = to; return false; }
    };
    let slowT = 0; updateDoors(m, 0);
    while (!done && !caught && tt < 400) {
      updateDoors(m, tt); slowT = Math.max(0, slowT - dt); p.speed = CFG.playerSpeed * (slowT > 0 ? CFG.slow.mult : 1);
      updateMover(m, p, dt, { decide, arrive });
      for (const s of enemies) {
        if (!s.mv) { if (tt >= s.cfg.delay) { s.mv = makeEnemy(s.cfg, m, s.R, m.start); if (LEVELS[i].pack && opts.pack !== false) s.mv.onSpot = (src, cell) => packCall(m, src, enemies.map(x => x.mv), cell); } continue; }
        if (stepEnemy(m, s.mv, p, dt, tt)) caught = true;
      }
      tt += dt;
    }
    GAME.onSpotted = saved;
    return { lvl: i + 1, done, caught, flees, seconds: +tt.toFixed(1), applesLeft: left.size, hasKey };
  }
};
